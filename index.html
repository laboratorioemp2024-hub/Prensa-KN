<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medidor kN Prensa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;500;700&display=swap');

  :root {
    --bg: #0a0d10;
    --surface: #111620;
    --border: #1e2a38;
    --accent: #00e5a0;
    --accent2: #00b8ff;
    --warn: #ffb400;
    --danger: #ff3a3a;
    --text: #e8edf3;
    --muted: #4a5a6e;
    --font-mono: 'Share Tech Mono', monospace;
    --font-ui: 'Barlow Condensed', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font-ui); min-height: 100vh; }

  body { padding: 16px; max-width: 640px; margin: 0 auto; }

  h1 {
    font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  h1::before { content: ''; display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1.5s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* Main KN display */
  .kn-display {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px 24px 16px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }
  .kn-display::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scan 3s linear infinite;
  }
  @keyframes scan { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

  .kn-label { font-size: 11px; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 6px; }
  .kn-value {
    font-family: var(--font-mono);
    font-size: 72px;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -2px;
    transition: color 0.3s;
  }
  .kn-value.warn { color: var(--warn); }
  .kn-value.danger { color: var(--danger); }
  .kn-unit { font-size: 18px; color: var(--muted); font-weight: 300; letter-spacing: 0.1em; margin-top: 4px; }

  /* Stats grid */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
  }
  .stat-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .stat-value { font-family: var(--font-mono); font-size: 22px; color: var(--text); }
  .stat-unit { font-size: 10px; color: var(--muted); }

  /* Rate bar */
  .rate-bar-wrap {
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .rate-bar-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .rate-bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .rate-bar-fill { height: 100%; border-radius: 3px; transition: width 0.2s, background 0.3s; width: 0%; background: var(--accent); }

  /* Camera */
  .cam-section {
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    overflow: hidden; margin-bottom: 12px; position: relative;
  }
  .cam-section video { display: block; width: 100%; max-height: 220px; object-fit: cover; }
  .cam-section canvas.proc { display: none; }
  .cam-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .cam-off-msg {
    padding: 40px 20px; text-align: center; color: var(--muted);
    font-size: 13px; letter-spacing: 0.05em;
  }

  /* ROI drag handle */
  .roi-handle {
    position: absolute;
    border: 1.5px solid var(--accent2);
    background: rgba(0,184,255,0.05);
    cursor: move;
    box-shadow: 0 0 0 1px rgba(0,184,255,0.15);
  }
  .roi-handle::after {
    content: 'ZONA OCR';
    position: absolute; top: 3px; left: 3px;
    font-size: 9px; letter-spacing: 0.12em; color: var(--accent2);
    font-family: var(--font-ui);
  }

  /* Controls */
  .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  button {
    font-family: var(--font-ui); font-size: 13px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 9px 18px; border-radius: 3px; cursor: pointer; border: 1px solid;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn-primary:hover { background: #00ffb3; }
  .btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: rgba(255,58,58,0.1); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  /* API key input */
  .api-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .api-row label { font-size: 11px; letter-spacing: 0.1em; color: var(--muted); white-space: nowrap; }
  .api-row input {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
    color: var(--text); font-family: var(--font-mono); font-size: 12px; padding: 7px 10px;
    outline: none;
  }
  .api-row input:focus { border-color: var(--accent); }

  /* Interval */
  .interval-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .interval-row label { font-size: 11px; letter-spacing: 0.1em; color: var(--muted); }
  .interval-row input[type=range] { flex: 1; min-width: 80px; accent-color: var(--accent2); }
  .interval-row span { font-family: var(--font-mono); font-size: 13px; min-width: 36px; }

  /* Log */
  .log-wrap {
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 0; overflow: hidden;
  }
  .log-header {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  .log-body {
    max-height: 130px; overflow-y: auto; padding: 8px 12px;
    font-family: var(--font-mono); font-size: 12px; line-height: 1.8;
  }
  .log-body p { color: var(--muted); }
  .log-body p.data { color: var(--text); }
  .log-body p.ok { color: var(--accent); }
  .log-body p.err { color: var(--danger); }

  #status-bar {
    font-size: 11px; letter-spacing: 0.05em; color: var(--muted);
    margin-bottom: 8px; min-height: 16px;
  }
  #status-bar.active { color: var(--accent2); }

  .badge {
    display: inline-block; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 2px; font-family: var(--font-ui); font-weight: 500;
  }
  .badge-ok { background: rgba(0,229,160,0.15); color: var(--accent); border: 1px solid rgba(0,229,160,0.3); }
  .badge-wait { background: rgba(74,90,110,0.3); color: var(--muted); border: 1px solid var(--border); }
</style>
</head>
<body>

<h1>Medidor de Carga en Prensa</h1>

<div class="kn-display">
  <div class="kn-label">CARGA ACTUAL</div>
  <div class="kn-value" id="kn-val">—</div>
  <div class="kn-unit">kN</div>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-label">Velocidad</div>
    <div class="stat-value" id="stat-vel">—</div>
    <div class="stat-unit">kN/s</div>
  </div>
  <div class="stat">
    <div class="stat-label">Máx. carga</div>
    <div class="stat-value" id="stat-max">—</div>
    <div class="stat-unit">kN</div>
  </div>
  <div class="stat">
    <div class="stat-label">Tiempo</div>
    <div class="stat-value" id="stat-time">0.0</div>
    <div class="stat-unit">s</div>
  </div>
</div>

<div class="rate-bar-wrap">
  <div class="rate-bar-label">
    <span>TASA DE CARGA</span>
    <span id="rate-label">0.0 kN/s</span>
  </div>
  <div class="rate-bar-track">
    <div class="rate-bar-fill" id="rate-bar"></div>
  </div>
</div>

<!-- Camera -->
<div class="cam-section" id="cam-section">
  <div class="cam-off-msg" id="cam-off">Cámara no iniciada</div>
  <video id="vid" autoplay playsinline muted style="display:none;"></video>
  <canvas id="proc" class="proc"></canvas>
  <canvas id="cam-canvas" class="cam-overlay"></canvas>
</div>

<!-- API Key -->
<div class="api-row">
  <label>API KEY</label>
  <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off" />
</div>

<!-- Interval -->
<div class="interval-row">
  <label>CAPTURA CADA</label>
  <input type="range" id="interval" min="1" max="10" value="3" step="1" />
  <span id="interval-val">3s</span>
  <label style="margin-left:8px;">MAX ESCALA</label>
  <input type="number" id="max-scale" value="100" min="1" style="width:70px;background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:var(--font-mono);font-size:12px;padding:4px 8px;" />
  <span style="font-size:11px;color:var(--muted);">kN</span>
</div>

<div id="status-bar">Listo.</div>

<div class="controls">
  <button class="btn-primary" id="btn-cam">Iniciar cámara</button>
  <button class="btn-outline" id="btn-start" disabled>Iniciar medición</button>
  <button class="btn-danger" id="btn-stop" disabled>Detener</button>
  <button class="btn-outline" id="btn-reset" disabled>Reiniciar</button>
</div>

<div class="log-wrap">
  <div class="log-header">
    <span>REGISTRO</span>
    <span id="ocr-badge" class="badge badge-wait">OCR inactivo</span>
  </div>
  <div class="log-body" id="log"><p>— esperando inicio —</p></div>
</div>

<script>
const vid = document.getElementById('vid');
const proc = document.getElementById('proc');
const camCanvas = document.getElementById('cam-canvas');
const camSection = document.getElementById('cam-section');
const camOff = document.getElementById('cam-off');
const knVal = document.getElementById('kn-val');
const statVel = document.getElementById('stat-vel');
const statMax = document.getElementById('stat-max');
const statTime = document.getElementById('stat-time');
const rateBar = document.getElementById('rate-bar');
const rateLabel = document.getElementById('rate-label');
const statusBar = document.getElementById('status-bar');
const logBody = document.getElementById('log');
const ocrBadge = document.getElementById('ocr-badge');
const intervalSlider = document.getElementById('interval');
const intervalVal = document.getElementById('interval-val');

let measuring = false, camActive = false;
let startTime = null;
let prevKn = null, prevTime = null;
let maxKn = null;
let intervalId = null;
let logLines = [];
let isFetching = false;

// ROI state (fraction of video)
let roi = {x: 0.05, y: 0.2, w: 0.9, h: 0.6};
let dragging = false, dragStart = null, dragRoi = null;

intervalSlider.oninput = () => { intervalVal.textContent = intervalSlider.value + 's'; };

function addLog(msg, cls='') {
  logLines.push({msg, cls});
  if (logLines.length > 60) logLines.shift();
  logBody.innerHTML = logLines.map(l => `<p class="${l.cls}">${l.msg}</p>`).join('');
  logBody.scrollTop = logBody.scrollHeight;
}

function setStatus(msg, active=false) {
  statusBar.textContent = msg;
  statusBar.className = active ? 'active' : '';
}

function updateDisplay(kn) {
  knVal.textContent = kn.toFixed(1);
  const maxScale = parseFloat(document.getElementById('max-scale').value) || 100;
  const pct = Math.min(100, (kn / maxScale) * 100);
  if (kn < maxScale * 0.6) { knVal.className = 'kn-value'; }
  else if (kn < maxScale * 0.85) { knVal.className = 'kn-value warn'; }
  else { knVal.className = 'kn-value danger'; }

  rateBar.style.width = pct + '%';
  rateBar.style.background = pct < 60 ? 'var(--accent)' : pct < 85 ? 'var(--warn)' : 'var(--danger)';
}

// Camera init
document.getElementById('btn-cam').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}
    });
    vid.srcObject = stream;
    vid.style.display = 'block';
    camOff.style.display = 'none';
    await vid.play();
    camActive = true;
    document.getElementById('btn-cam').disabled = true;
    document.getElementById('btn-start').disabled = false;
    setStatus('Cámara activa. Encuadra el display de la prensa en la zona azul.', true);
    addLog('Cámara iniciada.', 'ok');
    requestAnimationFrame(drawOverlay);
  } catch(e) {
    setStatus('Error cámara: ' + e.message);
    addLog('Error: ' + e.message, 'err');
  }
};

document.getElementById('btn-start').onclick = () => {
  const key = document.getElementById('api-key').value.trim();
  if (!key) { setStatus('Ingresa tu API key de Anthropic.'); return; }
  measuring = true;
  startTime = performance.now();
  prevKn = null; prevTime = null; maxKn = null;
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('btn-reset').disabled = false;
  ocrBadge.className = 'badge badge-ok';
  ocrBadge.textContent = 'OCR activo';
  addLog('--- Medición iniciada ---', 'ok');
  setStatus('Capturando...', true);
  scheduleCapture();
};

document.getElementById('btn-stop').onclick = () => {
  measuring = false;
  clearTimeout(intervalId);
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('btn-start').disabled = false;
  ocrBadge.className = 'badge badge-wait';
  ocrBadge.textContent = 'OCR pausado';
  addLog('--- Medición detenida ---');
  setStatus('Detenido.');
};

document.getElementById('btn-reset').onclick = () => {
  measuring = false;
  clearTimeout(intervalId);
  prevKn = null; prevTime = null; maxKn = null; startTime = null;
  knVal.textContent = '—'; knVal.className = 'kn-value';
  statVel.textContent = '—'; statMax.textContent = '—'; statTime.textContent = '0.0';
  rateBar.style.width = '0%'; rateLabel.textContent = '0.0 kN/s';
  logLines = []; logBody.innerHTML = '<p>— reiniciado —</p>';
  ocrBadge.className = 'badge badge-wait'; ocrBadge.textContent = 'OCR inactivo';
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('btn-reset').disabled = true;
  setStatus('Reiniciado.');
};

function scheduleCapture() {
  if (!measuring) return;
  const secs = parseInt(intervalSlider.value) || 3;
  intervalId = setTimeout(async () => {
    if (!measuring) return;
    await captureAndOCR();
    scheduleCapture();
  }, secs * 1000);
}

async function captureAndOCR() {
  if (isFetching || !vid.videoWidth) return;
  isFetching = true;
  setStatus('Leyendo display...', true);

  try {
    const vw = vid.videoWidth, vh = vid.videoHeight;
    proc.width = Math.round(roi.w * vw);
    proc.height = Math.round(roi.h * vh);
    const ctx = proc.getContext('2d');
    ctx.drawImage(vid, Math.round(roi.x * vw), Math.round(roi.y * vh), proc.width, proc.height, 0, 0, proc.width, proc.height);

    // Enhance contrast for OCR
    const imgData = ctx.getImageData(0, 0, proc.width, proc.height);
    for (let i = 0; i < imgData.data.length; i += 4) {
      const r = imgData.data[i], g = imgData.data[i+1], b = imgData.data[i+2];
      const lum = 0.299*r + 0.587*g + 0.114*b;
      const enhanced = Math.min(255, Math.max(0, (lum - 128) * 1.5 + 128));
      imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = enhanced;
    }
    ctx.putImageData(imgData, 0, 0);

    const b64 = proc.toDataURL('image/jpeg', 0.92).split(',')[1];
    const key = document.getElementById('api-key').value.trim();

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 100,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: 'image/jpeg', data: b64 }
            },
            {
              type: 'text',
              text: 'Esta es una imagen del display de una prensa hidráulica. Lee el valor numérico de carga que aparece en la pantalla. Responde ÚNICAMENTE con el número (puede tener decimales). Si no puedes leerlo claramente, responde "?". No incluyas unidades ni texto extra.'
            }
          ]
        }]
      })
    });

    const data = await res.json();
    const raw = data?.content?.[0]?.text?.trim() || '?';
    const now = performance.now();
    const elapsed = startTime ? (now - startTime) / 1000 : 0;

    if (raw === '?' || isNaN(parseFloat(raw))) {
      addLog(`t=${elapsed.toFixed(1)}s  OCR: no legible (${raw})`, 'err');
      setStatus('No se pudo leer el display. Ajusta encuadre.');
    } else {
      const kn = parseFloat(raw);
      updateDisplay(kn);
      statTime.textContent = elapsed.toFixed(1);

      if (maxKn === null || kn > maxKn) {
        maxKn = kn;
        statMax.textContent = kn.toFixed(1);
      }

      let velStr = '—';
      if (prevKn !== null && prevTime !== null) {
        const dt = (now - prevTime) / 1000;
        if (dt > 0.1) {
          const vel = (kn - prevKn) / dt;
          velStr = vel.toFixed(2);
          statVel.textContent = velStr;
          const maxScale = parseFloat(document.getElementById('max-scale').value) || 100;
          rateLabel.textContent = vel.toFixed(2) + ' kN/s';
          addLog(`t=${elapsed.toFixed(1)}s  ${kn.toFixed(1)} kN  |  ${vel.toFixed(2)} kN/s`, 'data');
        }
      } else {
        addLog(`t=${elapsed.toFixed(1)}s  ${kn.toFixed(1)} kN  (primera lectura)`, 'data');
      }

      prevKn = kn;
      prevTime = now;
      setStatus(`Última lectura: ${kn.toFixed(1)} kN`, true);
    }
  } catch(e) {
    addLog('Error API: ' + e.message, 'err');
    setStatus('Error de conexión.');
  }

  isFetching = false;
}

// Draw camera overlay with ROI
function drawOverlay() {
  if (!camActive) return;
  const ow = camCanvas.offsetWidth, oh = camCanvas.offsetHeight;
  if (ow === 0) { requestAnimationFrame(drawOverlay); return; }
  camCanvas.width = ow; camCanvas.height = oh;
  const ctx = camCanvas.getContext('2d');
  ctx.clearRect(0, 0, ow, oh);

  const rx = roi.x * ow, ry = roi.y * oh, rw = roi.w * ow, rh = roi.h * oh;

  // Dim outside ROI
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, ow, ry);
  ctx.fillRect(0, ry + rh, ow, oh - ry - rh);
  ctx.fillRect(0, ry, rx, rh);
  ctx.fillRect(rx + rw, ry, ow - rx - rw, rh);

  // ROI border
  ctx.strokeStyle = '#00b8ff';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(rx, ry, rw, rh);

  // Corner handles
  const hs = 10;
  ctx.fillStyle = '#00b8ff';
  [[rx,ry],[rx+rw,ry],[rx,ry+rh],[rx+rw,ry+rh]].forEach(([cx,cy]) => {
    ctx.fillRect(cx-hs/2, cy-hs/2, hs, hs);
  });

  ctx.fillStyle = 'rgba(0,184,255,0.08)';
  ctx.fillRect(rx, ry, rw, rh);

  ctx.fillStyle = '#00b8ff';
  ctx.font = '500 10px Barlow Condensed, sans-serif';
  ctx.letterSpacing = '0.1em';
  ctx.fillText('ZONA OCR — arrastra para ajustar', rx + 6, ry + 14);

  requestAnimationFrame(drawOverlay);
}

// ROI drag
camCanvas.addEventListener('mousedown', startDrag);
camCanvas.addEventListener('touchstart', e => startDrag(e.touches[0]), {passive: true});
camCanvas.addEventListener('mousemove', doDrag);
camCanvas.addEventListener('touchmove', e => { e.preventDefault(); doDrag(e.touches[0]); }, {passive: false});
camCanvas.addEventListener('mouseup', endDrag);
camCanvas.addEventListener('touchend', endDrag);

function getRel(e) {
  const r = camCanvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}

function startDrag(e) {
  const p = getRel(e);
  if (p.x >= roi.x && p.x <= roi.x+roi.w && p.y >= roi.y && p.y <= roi.y+roi.h) {
    dragging = true;
    dragStart = p;
    dragRoi = {...roi};
  }
}
function doDrag(e) {
  if (!dragging) return;
  const p = getRel(e);
  const dx = p.x - dragStart.x, dy = p.y - dragStart.y;
  let nx = dragRoi.x + dx, ny = dragRoi.y + dy;
  nx = Math.max(0, Math.min(1 - roi.w, nx));
  ny = Math.max(0, Math.min(1 - roi.h, ny));
  roi.x = nx; roi.y = ny;
}
function endDrag() { dragging = false; }
</script>
</body>
</html>
