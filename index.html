<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medidor kN Prensa</title>
<script src="https://unpkg.com/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;500;700&display=swap');
  :root {
    --bg: #0a0d10; --surface: #111620; --border: #1e2a38;
    --accent: #00e5a0; --accent2: #00b8ff; --warn: #ffb400; --danger: #ff3a3a;
    --text: #e8edf3; --muted: #4a5a6e;
    --mono: 'Share Tech Mono', monospace; --ui: 'Barlow Condensed', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--ui); padding: 14px; max-width: 600px; margin: 0 auto; }

  h1 { font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  h1::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--accent); animation: blink 1.5s infinite; display:block; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.2} }

  .kn-box { background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:16px 20px 12px; margin-bottom:10px; position:relative; overflow:hidden; }
  .kn-box::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); animation:scan 3s linear infinite; }
  @keyframes scan { 0%{transform:translateX(-100%)}100%{transform:translateX(100%)} }
  .kn-label { font-size:10px; letter-spacing:0.15em; color:var(--muted); margin-bottom:4px; }
  .kn-val { font-family:var(--mono); font-size:64px; line-height:1; color:var(--accent); transition:color 0.3s; }
  .kn-val.warn { color:var(--warn); }
  .kn-val.danger { color:var(--danger); }
  .kn-unit { font-size:16px; color:var(--muted); margin-top:2px; }

  .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:8px 12px; }
  .stat-label { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .stat-val { font-family:var(--mono); font-size:20px; color:var(--text); }
  .stat-unit { font-size:10px; color:var(--muted); }

  .bar-wrap { background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:8px 12px; margin-bottom:10px; }
  .bar-top { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between; }
  .bar-track { height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:3px; width:0%; background:var(--accent); transition:width 0.3s, background 0.3s; }

  .cam-wrap { background:#000; border:1px solid var(--border); border-radius:4px; overflow:hidden; margin-bottom:10px; position:relative; }
  video { display:block; width:100%; max-height:200px; object-fit:cover; }
  #oc { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  #drag-roi { position:absolute; border:2px solid var(--accent2); background:rgba(0,184,255,0.07); cursor:move; touch-action:none; }
  #drag-roi span { position:absolute; top:3px; left:4px; font-size:9px; letter-spacing:0.1em; color:var(--accent2); font-family:var(--ui); pointer-events:none; }

  .interval-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .interval-row label { font-size:11px; letter-spacing:0.08em; color:var(--muted); }
  .interval-row input[type=range] { flex:1; min-width:80px; accent-color:var(--accent2); }
  .interval-row span { font-family:var(--mono); font-size:13px; min-width:30px; }
  .interval-row input[type=number] { width:65px; background:var(--surface); border:1px solid var(--border); border-radius:3px; color:var(--text); font-family:var(--mono); font-size:12px; padding:4px 7px; }

  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  button { font-family:var(--ui); font-size:13px; font-weight:500; letter-spacing:0.07em; text-transform:uppercase; padding:8px 16px; border-radius:3px; cursor:pointer; border:1px solid; transition:all 0.15s; }
  .btn-p { background:var(--accent); color:#000; border-color:var(--accent); }
  .btn-p:hover { background:#00ffb3; }
  .btn-o { background:transparent; color:var(--text); border-color:var(--border); }
  .btn-o:hover { border-color:var(--accent); color:var(--accent); }
  .btn-d { background:transparent; color:var(--danger); border-color:var(--danger); }
  button:disabled { opacity:0.3; cursor:not-allowed; }

  #status { font-size:11px; color:var(--muted); margin-bottom:8px; min-height:16px; }
  #status.act { color:var(--accent2); }

  .log-wrap { background:var(--surface); border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  .log-head { padding:6px 12px; border-bottom:1px solid var(--border); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; }
  .log-body { max-height:120px; overflow-y:auto; padding:6px 12px; font-family:var(--mono); font-size:11px; line-height:1.8; }
  .log-body p { color:var(--muted); }
  .log-body p.d { color:var(--text); }
  .log-body p.ok { color:var(--accent); }
  .log-body p.er { color:var(--danger); }

  #progress-wrap { display:none; background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:8px 12px; margin-bottom:10px; }
  #progress-wrap.show { display:block; }
  #progress-label { font-size:11px; color:var(--muted); margin-bottom:4px; }
  #progress-bar-track { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  #progress-bar { height:100%; background:var(--accent2); border-radius:2px; width:0%; transition:width 0.2s; }
</style>
</head>
<body>

<h1>Medidor de Carga · Prensa</h1>

<div class="kn-box">
  <div class="kn-label">CARGA ACTUAL</div>
  <div class="kn-val" id="kn">—</div>
  <div class="kn-unit">kN</div>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-label">Velocidad</div>
    <div class="stat-val" id="sv">—</div>
    <div class="stat-unit">kN/s</div>
  </div>
  <div class="stat">
    <div class="stat-label">Máx. carga</div>
    <div class="stat-val" id="sm">—</div>
    <div class="stat-unit">kN</div>
  </div>
  <div class="stat">
    <div class="stat-label">Tiempo</div>
    <div class="stat-val" id="st">0.0</div>
    <div class="stat-unit">s</div>
  </div>
</div>

<div class="bar-wrap">
  <div class="bar-top"><span>NIVEL DE CARGA</span><span id="bar-lbl">0.0 kN</span></div>
  <div class="bar-track"><div class="bar-fill" id="bf"></div></div>
</div>

<div class="cam-wrap" id="cam-wrap">
  <video id="vid" autoplay playsinline muted></video>
  <div id="drag-roi"><span>ZONA OCR — arrastra</span></div>
  <canvas id="proc" style="display:none;"></canvas>
  <canvas id="oc"></canvas>
</div>

<div id="progress-wrap">
  <div id="progress-label">Iniciando OCR...</div>
  <div id="progress-bar-track"><div id="progress-bar"></div></div>
</div>

<div class="interval-row">
  <label>CADA</label>
  <input type="range" id="intv" min="2" max="15" value="4" step="1"/>
  <span id="intv-val">4s</span>
  <label>ESCALA MÁX</label>
  <input type="number" id="maxkn" value="100" min="1"/>
  <span style="font-size:11px;color:var(--muted);">kN</span>
</div>

<div id="status">Presiona "Iniciar cámara" para comenzar.</div>

<div class="controls">
  <button class="btn-p" id="bc">Iniciar cámara</button>
  <button class="btn-o" id="bs" disabled>Iniciar medición</button>
  <button class="btn-d" id="bx" disabled>Detener</button>
  <button class="btn-o" id="br" disabled>Reiniciar</button>
</div>

<div class="log-wrap">
  <div class="log-head"><span>REGISTRO</span><span id="ocr-st">OCR inactivo</span></div>
  <div class="log-body" id="log"><p>— esperando —</p></div>
</div>

<script>
const vid = document.getElementById('vid');
const proc = document.getElementById('proc');
const oc = document.getElementById('oc');
const knEl = document.getElementById('kn');
const svEl = document.getElementById('sv');
const smEl = document.getElementById('sm');
const stEl = document.getElementById('st');
const bf = document.getElementById('bf');
const barLbl = document.getElementById('bar-lbl');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const ocrSt = document.getElementById('ocr-st');
const roi = document.getElementById('drag-roi');
const pw = document.getElementById('progress-wrap');
const pb = document.getElementById('progress-bar');
const pbl = document.getElementById('progress-label');
const intvSlider = document.getElementById('intv');
const intvVal = document.getElementById('intv-val');

let measuring = false, camActive = false, busy = false;
let worker = null, workerReady = false;
let startTime = null, prevKn = null, prevT = null, maxKn = null;
let timer = null;
let logs = [];

// ROI drag
let dragging = false, dx0 = 0, dy0 = 0, rx0 = 0, ry0 = 0;

function pct(el, prop) {
  const wrap = document.getElementById('cam-wrap');
  const r = wrap.getBoundingClientRect();
  return prop === 'x' ? (el.offsetLeft / r.width) :
         prop === 'y' ? (el.offsetTop / r.height) :
         prop === 'w' ? (el.offsetWidth / r.width) :
                        (el.offsetHeight / r.height);
}

roi.addEventListener('pointerdown', e => {
  dragging = true;
  dx0 = e.clientX; dy0 = e.clientY;
  rx0 = roi.offsetLeft; ry0 = roi.offsetTop;
  roi.setPointerCapture(e.pointerId);
});
roi.addEventListener('pointermove', e => {
  if (!dragging) return;
  const wrap = document.getElementById('cam-wrap');
  const maxX = wrap.offsetWidth - roi.offsetWidth;
  const maxY = wrap.offsetHeight - roi.offsetHeight;
  let nx = rx0 + (e.clientX - dx0);
  let ny = ry0 + (e.clientY - dy0);
  nx = Math.max(0, Math.min(maxX, nx));
  ny = Math.max(0, Math.min(maxY, ny));
  roi.style.left = nx + 'px';
  roi.style.top = ny + 'px';
});
roi.addEventListener('pointerup', () => { dragging = false; });

intvSlider.oninput = () => { intvVal.textContent = intvSlider.value + 's'; };

function addLog(msg, cls='') {
  logs.push({msg, cls});
  if (logs.length > 60) logs.shift();
  logEl.innerHTML = logs.map(l => `<p class="${l.cls}">${l.msg}</p>`).join('');
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(msg, act=false) {
  statusEl.textContent = msg;
  statusEl.className = act ? 'act' : '';
}

async function initWorker() {
  pw.classList.add('show');
  pbl.textContent = 'Cargando OCR...';
  pb.style.width = '10%';
  try {
    worker = await Tesseract.createWorker('eng', 1, {
      logger: m => {
        if (m.status === 'loading tesseract core') { pb.style.width='20%'; pbl.textContent='Cargando motor OCR...'; }
        if (m.status === 'loading language traineddata') { pb.style.width='50%'; pbl.textContent='Cargando idioma...'; }
        if (m.status === 'initializing api') { pb.style.width='80%'; pbl.textContent='Iniciando...'; }
      }
    });
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789.',
      tessedit_pageseg_mode: '7',
    });
    pb.style.width = '100%';
    pbl.textContent = 'OCR listo';
    setTimeout(() => pw.classList.remove('show'), 1000);
    workerReady = true;
    addLog('OCR listo (Tesseract).', 'ok');
    setStatus('OCR cargado. Listo para medir.', true);
    document.getElementById('bs').disabled = false;
  } catch(e) {
    pbl.textContent = 'Error cargando OCR: ' + e.message;
    addLog('Error OCR: ' + e.message, 'er');
  }
}

document.getElementById('bc').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: {ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}
    });
    vid.srcObject = stream;
    await vid.play();
    camActive = true;
    document.getElementById('bc').disabled = true;
    setStatus('Cámara activa. Cargando OCR...', true);
    addLog('Cámara iniciada.', 'ok');

    // Position ROI default
    const wrap = document.getElementById('cam-wrap');
    setTimeout(() => {
      const wh = wrap.offsetHeight, ww = wrap.offsetWidth;
      roi.style.left = Math.round(ww * 0.05) + 'px';
      roi.style.top = Math.round(wh * 0.2) + 'px';
      roi.style.width = Math.round(ww * 0.9) + 'px';
      roi.style.height = Math.round(wh * 0.6) + 'px';
    }, 300);

    await initWorker();
  } catch(e) {
    setStatus('Error cámara: ' + e.message);
    addLog('Error: ' + e.message, 'er');
  }
};

document.getElementById('bs').onclick = () => {
  if (!workerReady) { setStatus('OCR aún cargando, espera...'); return; }
  measuring = true;
  startTime = performance.now();
  prevKn = null; prevT = null; maxKn = null;
  document.getElementById('bs').disabled = true;
  document.getElementById('bx').disabled = false;
  document.getElementById('br').disabled = false;
  ocrSt.textContent = 'OCR activo';
  addLog('--- Medición iniciada ---', 'ok');
  setStatus('Midiendo...', true);
  scheduleCapture();
};

document.getElementById('bx').onclick = () => {
  measuring = false;
  clearTimeout(timer);
  document.getElementById('bx').disabled = true;
  document.getElementById('bs').disabled = false;
  ocrSt.textContent = 'OCR pausado';
  addLog('--- Detenido ---');
  setStatus('Detenido.');
};

document.getElementById('br').onclick = () => {
  measuring = false; clearTimeout(timer);
  prevKn = null; prevT = null; maxKn = null; startTime = null;
  knEl.textContent = '—'; knEl.className = 'kn-val';
  svEl.textContent = '—'; smEl.textContent = '—'; stEl.textContent = '0.0';
  bf.style.width = '0%'; barLbl.textContent = '0.0 kN';
  logs = []; logEl.innerHTML = '<p>— reiniciado —</p>';
  ocrSt.textContent = 'OCR inactivo';
  document.getElementById('bs').disabled = false;
  document.getElementById('bx').disabled = true;
  document.getElementById('br').disabled = true;
  setStatus('Reiniciado.');
};

function scheduleCapture() {
  if (!measuring) return;
  const secs = parseInt(intvSlider.value) || 4;
  timer = setTimeout(async () => {
    if (!measuring) return;
    await doOCR();
    scheduleCapture();
  }, secs * 1000);
}

async function doOCR() {
  if (busy || !vid.videoWidth || !workerReady) return;
  busy = true;
  setStatus('Leyendo display...', true);

  try {
    const wrap = document.getElementById('cam-wrap');
    const ww = wrap.offsetWidth, wh = wrap.offsetHeight;
    const vw = vid.videoWidth, vh = vid.videoHeight;

    // ROI in video coords
    const scaleX = vw / ww, scaleY = vh / wh;
    const rx = Math.round(roi.offsetLeft * scaleX);
    const ry = Math.round(roi.offsetTop * scaleY);
    const rw = Math.round(roi.offsetWidth * scaleX);
    const rh = Math.round(roi.offsetHeight * scaleY);

    proc.width = rw; proc.height = rh;
    const ctx = proc.getContext('2d');
    ctx.drawImage(vid, rx, ry, rw, rh, 0, 0, rw, rh);

    // Enhance: grayscale + contrast boost
    const id = ctx.getImageData(0, 0, rw, rh);
    for (let i = 0; i < id.data.length; i += 4) {
      const lum = 0.299*id.data[i] + 0.587*id.data[i+1] + 0.114*id.data[i+2];
      const e = Math.min(255, Math.max(0, (lum - 128) * 2.0 + 128));
      id.data[i] = id.data[i+1] = id.data[i+2] = e;
    }
    ctx.putImageData(id, 0, 0);

    const { data: { text } } = await worker.recognize(proc);
    const clean = text.replace(/[^0-9.]/g, '').trim();
    const kn = parseFloat(clean);
    const now = performance.now();
    const elapsed = (now - startTime) / 1000;

    if (isNaN(kn)) {
      addLog(`t=${elapsed.toFixed(1)}s  no legible: "${text.trim()}"`, 'er');
      setStatus('No se pudo leer. Ajusta la zona OCR.');
    } else {
      const maxScale = parseFloat(document.getElementById('maxkn').value) || 100;
      knEl.textContent = kn.toFixed(1);
      const p = Math.min(100, (kn / maxScale) * 100);
      knEl.className = p < 60 ? 'kn-val' : p < 85 ? 'kn-val warn' : 'kn-val danger';
      bf.style.width = p + '%';
      bf.style.background = p < 60 ? 'var(--accent)' : p < 85 ? 'var(--warn)' : 'var(--danger)';
      barLbl.textContent = kn.toFixed(1) + ' kN';
      stEl.textContent = elapsed.toFixed(1);

      if (maxKn === null || kn > maxKn) { maxKn = kn; smEl.textContent = kn.toFixed(1); }

      if (prevKn !== null && prevT !== null) {
        const dt = (now - prevT) / 1000;
        if (dt > 0.1) {
          const vel = (kn - prevKn) / dt;
          svEl.textContent = vel.toFixed(2);
          addLog(`t=${elapsed.toFixed(1)}s  ${kn.toFixed(1)} kN  →  ${vel.toFixed(2)} kN/s`, 'd');
        }
      } else {
        addLog(`t=${elapsed.toFixed(1)}s  ${kn.toFixed(1)} kN  (primera lectura)`, 'd');
      }
      prevKn = kn; prevT = now;
      setStatus(`Última lectura: ${kn.toFixed(1)} kN`, true);
    }
  } catch(e) {
    addLog('Error OCR: ' + e.message, 'er');
  }
  busy = false;
}
</script>
</body>
</html>
